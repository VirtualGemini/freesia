name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate repository policy and regression cases
        run: make check-policy
      - name: Validate maintainer squash message on main
        if: github.event_name == 'push'
        run: |
          git show -s --format=%B "$GITHUB_SHA" > "$RUNNER_TEMP/freesia-merge-message.txt"
          python3 scripts/repository_policy.py message "$RUNNER_TEMP/freesia-merge-message.txt"

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect backend package or policy-only bootstrap
        id: package
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/repository_policy.py package-presence freesia-admin/pom.xml "$BASE_SHA" >> "$GITHUB_OUTPUT"
      - name: Set up Java 25
        if: steps.package.outputs.present == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: 'freesia-admin/**/pom.xml'
      - name: Verify backend and real PostgreSQL/Valkey tests
        if: steps.package.outputs.present == 'true'
        working-directory: freesia-admin
        run: mvn -B verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: '0'
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect frontend package or policy-only bootstrap
        id: package
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/repository_policy.py package-presence freesia-web/package.json "$BASE_SHA" >> "$GITHUB_OUTPUT"
      - name: Set up pnpm
        if: steps.package.outputs.present == 'true'
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.8.0
          run_install: false
      - name: Set up Node
        if: steps.package.outputs.present == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: freesia-web/pnpm-lock.yaml
      - name: Install frozen frontend dependencies
        if: steps.package.outputs.present == 'true'
        working-directory: freesia-web
        run: pnpm install --frozen-lockfile
      - name: Lint and build frontend
        if: steps.package.outputs.present == 'true'
        working-directory: freesia-web
        run: |
          pnpm lint
          pnpm build
      - name: Reject dependency or source drift
        if: steps.package.outputs.present == 'true'
        run: git diff --exit-code
