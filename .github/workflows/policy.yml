name: Trusted Policy

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: trusted-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted base policy only
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch PR head as data without checkout
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch origin "pull/${PR_NUMBER}/head:refs/remotes/origin/policy-pr-head"
      - name: Validate through trusted policy or report initialization
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          actual_head=$(git rev-parse refs/remotes/origin/policy-pr-head)
          test "$actual_head" = "$HEAD_SHA"
          if git cat-file -e "$BASE_SHA:scripts/repository_policy.py"; then
            python3 scripts/repository_policy.py pr "$BASE_SHA" "$HEAD_SHA" \
              --repository "$GITHUB_REPOSITORY" --number "$PR_NUMBER"
          else
            echo 'Policy initialization requires maintainer bootstrap review.'
            echo 'PR-provided policy is not executed by this trusted job.'
          fi
