spring:
  application:
    name: freesia-admin
  datasource:
    url: ${FREESIA_DB_URL:jdbc:postgresql://localhost:15432/freesia}
    username: ${FREESIA_DB_USERNAME:freesia}
    password: ${FREESIA_DB_PASSWORD:freesia-local}
  data:
    redis:
      host: ${FREESIA_REDIS_HOST:localhost}
      port: ${FREESIA_REDIS_PORT:16379}
      password: ${FREESIA_REDIS_PASSWORD:}
  flyway:
    enabled: true
    # Stable history location even after the freesia schema joins the PostgreSQL search_path.
    default-schema: public
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=5m
server:
  port: ${FREESIA_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
freesia:
  product:
    name: Freesia
    admin-name: Freesia Admin
    version: 0.1.0
sa-token:
  token-name: Authorization
  is-read-cookie: false
  is-log: false
mybatis-flex:
  global-config:
    print-banner: false
