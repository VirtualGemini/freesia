# Docker 内置 DNS 动态解析，后端容器重建后无需重启 Nginx。
resolver 127.0.0.11 valid=10s ipv6=off;

upstream freesia_backend {
    zone freesia_backend 64k;
    server freesia-admin:8080 resolve;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-src 'self'; object-src 'none'; base-uri 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /api/ {
        proxy_pass http://freesia_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖客户端伪造的转发头，可信链从当前 Nginx 实际收到的连接开始。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api {
        return 404;
    }

    location /actuator {
        return 404; # 探针仅供容器内部使用，不经前端入口公开
    }

    location / {
        try_files $uri $uri/ /index.html; # Vue history 路由刷新仍返回入口页面
    }
}
