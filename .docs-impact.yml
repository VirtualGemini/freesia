{
  "rules": [
    {
      "name": "backend-contract-and-foundation",
      "paths": ["freesia-admin/**"],
      "documents": ["specs/DEVELOPMENT_SPEC*.md", "README*.md"],
      "require": "any"
    },
    {
      "name": "frontend-contract-and-layout",
      "paths": ["freesia-web/src/**", "freesia-web/vite.config.ts", "freesia-web/index.html"],
      "documents": ["freesia-web/README*.md", "specs/DEVELOPMENT_SPEC*.md", "README*.md"],
      "require": "any"
    },
    {
      "name": "dependencies-and-environment",
      "paths": ["freesia-admin/**/pom.xml", "freesia-web/package.json", "freesia-web/pnpm-lock.yaml", "freesia-web/pnpm-workspace.yaml", "infra/**"],
      "documents": ["specs/DEVELOPMENT_SPEC*.md", "README*.md", "freesia-web/README*.md"],
      "require": "any"
    },
    {
      "name": "repository-workflow",
      "paths": [".github/**", ".gitignore", "scripts/**", "tests/repository_policy/**", ".policy-files", ".docs-impact.yml", "Makefile", "AGENTS.md", "freesia-web/.husky/**"],
      "documents": ["specs/PR_SPEC*.md"],
      "require": "any"
    }
  ]
}
